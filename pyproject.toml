[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auslosung"
version = "0.1.0a3"
description = "Zufallsziehung im Casino-Stil: Glücksrad, Plinko und Slots, live auf allen Handys (frühe Alpha)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []          # nur Standardbibliothek

[project.scripts]
auslosung = "auslosung.cli:main"

[tool.setuptools.packages.find]
include = ["auslosung*"]

[tool.setuptools.package-data]
auslosung = [
    "migrations/*.sql",
    "web/templates/*.html",
    "web/static/**/*",
]
