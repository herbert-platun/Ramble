name: Build

on:
  push:
    branches: [main, slots-und-gruppen]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python tools/bundle.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: auslosung.py
          path: dist/auslosung.py
      - name: Release
        if: matrix.python == '3.13' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/auslosung.py --prerelease --generate-notes
