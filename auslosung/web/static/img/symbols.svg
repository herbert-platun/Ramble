<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
<!-- Slot-Symbole · eigene Gestaltung (nach rea/blueprint) · viewBox 64 (Symbole) / 24 (Badges)
     Wird von web/pages.py in Bildschirm- und Handyseite eingebettet.
     Farben nur über CSS-Variablen (sym-Präfix), Fallback = Ramble-Palette.
     Nutzung: <svg class="sym"><use href="#sym-cherry"/></svg>  (Sprite inline ins HTML legen) -->
<style>
.o{stroke:var(--sym-line,#120a19);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.r{fill:var(--sym-red,#ff3d4f)}.rd{fill:var(--sym-red-deep,#b0142c)}
.g{fill:var(--sym-gold,#ffc23d)}.gl{fill:var(--sym-gold-lo,#b8701a)}.gh{fill:var(--sym-gold-hi,#ffe9a3)}
.n{fill:var(--sym-green,#45e07f)}.nd{fill:var(--sym-felt,#0f6b55)}
.b{fill:var(--sym-blue,#3a8dff)}.bd{fill:var(--sym-blue-deep,#1a4fb8)}
.c{fill:var(--sym-cream,#fff1d6)}.p{fill:var(--sym-pink,#ff5fae)}.k{fill:var(--sym-ink,#1a1024)}
.hl{fill:#fff;opacity:.55}.ln{fill:var(--sym-line,#120a19)}.no{fill:none}
</style>

<!-- ===== niedrig ===== -->
<symbol id="sym-cherry" viewBox="0 0 64 64">
  <path class="o no" d="M22 40 C24 26 30 16 40 10 M42 42 C40 30 40 20 40 10"/>
  <path fill="none" stroke="var(--sym-felt,#0f6b55)" stroke-width="1.8" stroke-linecap="round" d="M22 40 C24 26 30 16 40 10 M42 42 C40 30 40 20 40 10"/>
  <path class="o n" d="M40 10 C46 6 54 8 56 14 C50 16 44 15 40 10Z"/>
  <circle class="o r" cx="21" cy="44" r="11"/><circle class="o r" cx="43" cy="46" r="11"/>
  <circle class="hl" cx="17" cy="40" r="3"/><circle class="hl" cx="39" cy="42" r="3"/>
</symbol>

<symbol id="sym-lemon" viewBox="0 0 64 64">
  <g transform="rotate(-20 32 34)">
    <ellipse class="o g" cx="32" cy="34" rx="22" ry="16"/>
    <path class="o g" d="M9 34 L5 34 M55 34 L59 34"/>
    <path class="gh" d="M20 26 C26 22 34 21 40 23 C34 25 26 27 20 30Z"/>
  </g>
</symbol>

<!-- ===== mittel ===== -->
<symbol id="sym-bell" viewBox="0 0 64 64">
  <circle class="o g" cx="32" cy="9" r="4"/>
  <circle class="o gl" cx="32" cy="51" r="6"/>
  <path class="o g" d="M32 12 C21 12 17 22 17 33 C17 40 14 43 10 47 H54 C50 43 47 40 47 33 C47 22 43 12 32 12Z"/>
  <path class="gh" d="M23 22 C25 17 28 16 30 16 C27 21 26 28 26 36 H22 C22 30 22 26 23 22Z"/>
  <rect class="gl" x="14" y="44" width="36" height="3"/>
</symbol>

<symbol id="sym-horseshoe" viewBox="0 0 64 64">
  <path fill="none" stroke="var(--sym-line,#120a19)" stroke-width="18" stroke-linecap="square" d="M16 54 V30 A16 16 0 0 1 48 30 V54"/>
  <path fill="none" stroke="var(--sym-gold-lo,#b8701a)" stroke-width="10" stroke-linecap="square" d="M16 54 V30 A16 16 0 0 1 48 30 V54"/>
  <path fill="none" stroke="var(--sym-gold-hi,#ffe9a3)" stroke-width="3" d="M14 50 V30 A18 18 0 0 1 30 12.2"/>
  <rect class="ln" x="15" y="34" width="3" height="3"/><rect class="ln" x="15" y="44" width="3" height="3"/>
  <rect class="ln" x="46" y="34" width="3" height="3"/><rect class="ln" x="46" y="44" width="3" height="3"/>
  <rect class="ln" x="30" y="16" width="4" height="3"/>
</symbol>

<symbol id="sym-bar" viewBox="0 0 64 64">
  <rect class="o k" x="3" y="13" width="58" height="38" rx="5"/>
  <rect fill="none" stroke="var(--sym-gold,#ffc23d)" stroke-width="2" x="6.5" y="16.5" width="51" height="31" rx="3"/>
  <g class="c" shape-rendering="crispEdges"><rect x="10" y="24" width="3" height="3"/><rect x="13" y="24" width="3" height="3"/><rect x="16" y="24" width="3" height="3"/><rect x="10" y="27" width="3" height="3"/><rect x="19" y="27" width="3" height="3"/><rect x="10" y="30" width="3" height="3"/><rect x="13" y="30" width="3" height="3"/><rect x="16" y="30" width="3" height="3"/><rect x="10" y="33" width="3" height="3"/><rect x="19" y="33" width="3" height="3"/><rect x="10" y="36" width="3" height="3"/><rect x="13" y="36" width="3" height="3"/><rect x="16" y="36" width="3" height="3"/><rect x="29" y="24" width="3" height="3"/><rect x="32" y="24" width="3" height="3"/><rect x="26" y="27" width="3" height="3"/><rect x="35" y="27" width="3" height="3"/><rect x="26" y="30" width="3" height="3"/><rect x="29" y="30" width="3" height="3"/><rect x="32" y="30" width="3" height="3"/><rect x="35" y="30" width="3" height="3"/><rect x="26" y="33" width="3" height="3"/><rect x="35" y="33" width="3" height="3"/><rect x="26" y="36" width="3" height="3"/><rect x="35" y="36" width="3" height="3"/><rect x="42" y="24" width="3" height="3"/><rect x="45" y="24" width="3" height="3"/><rect x="48" y="24" width="3" height="3"/><rect x="42" y="27" width="3" height="3"/><rect x="51" y="27" width="3" height="3"/><rect x="42" y="30" width="3" height="3"/><rect x="45" y="30" width="3" height="3"/><rect x="48" y="30" width="3" height="3"/><rect x="42" y="33" width="3" height="3"/><rect x="48" y="33" width="3" height="3"/><rect x="42" y="36" width="3" height="3"/><rect x="51" y="36" width="3" height="3"/></g>
</symbol>

<symbol id="sym-chip" viewBox="0 0 64 64">
  <circle class="o p" cx="32" cy="32" r="24"/>
  <circle fill="none" stroke="var(--sym-cream,#fff1d6)" stroke-width="7" stroke-dasharray="8.95 8.95" cx="32" cy="32" r="20.5"/>
  <circle class="o c" cx="32" cy="32" r="12"/>
  <circle fill="none" stroke="var(--sym-pink,#ff5fae)" stroke-width="2" stroke-dasharray="3 3" cx="32" cy="32" r="8"/>
</symbol>

<!-- ===== hoch ===== -->
<symbol id="sym-diamond" viewBox="0 0 64 64">
  <path class="o b" d="M14 24 L22 12 H42 L50 24 L32 54Z"/>
  <path class="bd" d="M26 24 L32 54 L14 24Z M38 24 L50 24 L32 54Z"/>
  <path class="hl" d="M22 12 H32 L26 24 H14Z"/>
  <path fill="none" stroke="var(--sym-line,#120a19)" stroke-width="2" stroke-linejoin="round" d="M14 24 H50 M22 12 L26 24 L32 12 L38 24 L42 12 M26 24 L32 54 L38 24"/>
</symbol>

<symbol id="sym-seven" viewBox="0 0 64 64">
  <path class="o r" d="M12 10 H52 V20 L36 56 H22 L37 22 H22 V26 H12Z"/>
  <path class="rd" d="M48 20 L33 54 H36 L50 22Z"/>
  <path class="hl" d="M15 13 H49 V16 H15Z"/>
</symbol>

<!-- ===== Spezial (eigene Bedeutung: Wild / Bust) ===== -->
<symbol id="sym-star" viewBox="0 0 64 64">
  <polygon class="o g" points="32.0,11.0 37.9,26.9 54.8,27.6 41.5,38.1 46.1,54.4 32.0,45.0 17.9,54.4 22.5,38.1 9.2,27.6 26.1,26.9"/>
  <polygon class="gh" points="32,17 35.5,27.5 32,31 28.5,27.5"/>
  <circle class="ln" cx="27" cy="36" r="2.2"/><circle class="ln" cx="37" cy="36" r="2.2"/>
</symbol>

<symbol id="sym-snakeeyes" viewBox="0 0 64 64">
  <g transform="rotate(-12 20 36)"><rect class="o c" x="6" y="22" width="28" height="28" rx="6"/><circle class="r" cx="20" cy="36" r="5"/></g>
  <g transform="rotate(14 44 30)"><rect class="o c" x="30" y="16" width="28" height="28" rx="6"/><circle class="r" cx="44" cy="30" r="5"/></g>
</symbol>

<!-- ===== Faktor (eigener Entwurf: Münze mit Strahlen, Zahl kommt als Text darüber) ===== -->
<symbol id="sym-mult" viewBox="0 0 64 64">
  <g class="o" style="stroke-width:3.5">
    <path class="p" d="M32 3 L38 13 L49 8 L49 20 L61 22 L54 32 L61 42 L49 44 L49 56 L38 51 L32 61 L26 51 L15 56 L15 44 L3 42 L10 32 L3 22 L15 20 L15 8 L26 13Z"/>
  </g>
  <circle class="o g" cx="32" cy="32" r="17"/>
  <circle fill="none" stroke="var(--sym-gold-lo,#b8701a)" stroke-width="2" cx="32" cy="32" r="12.5"/>
  <path class="gh" d="M21 26 C23 20 28 17 33 17 C28 20 25 24 24 30Z"/>
</symbol>

</svg>
